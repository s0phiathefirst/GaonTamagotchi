<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e6e4">
<meta name="description" content="온마고치 — 실제 시간으로 자라는 웹 다마고치">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>온마고치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: phone-first one-screen toy — device fills the width, a speech bubble and a compact 4-up status row sit under it, settings fold away. Single light look matching the studio photo. */
:root{
  --bg:#e6e6e4;          /* photo backdrop grey */
  --ink:#3b2a33;         /* plum-brown ink */
  --muted:#8a7a82;
  --pink:#f0bfca;        /* plush face pink from the device */
  --pink-rim:#dc9cae;
  --pink-deep:#c95f84;
  --card:#f6f5f3;
  --line:#d9d4d3;
  --font-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --font-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:8px 24px;box-sizing:border-box;touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:4px}
h1{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0;color:var(--ink)}
h1 span{color:var(--pink-deep)}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

.device{position:relative;width:100%;max-width:100%;margin-inline:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.device img{display:block;width:100%;height:auto;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 96%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 96%,transparent);
  mask-composite:intersect}
#lcd,.glass{position:absolute;left:30.03%;top:34.73%;width:40.2%;height:34.85%;border-radius:3px}
#lcd{image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:inset 0 0 0 1px #0004}
.glass{pointer-events:none;background:linear-gradient(135deg,#ffffff38 0%,#ffffff00 38%,#ffffff00 70%,#ffffff1a 100%)}

/* pink plush buttons */
.hw{
  position:absolute;width:11.5%;aspect-ratio:1;max-width:100%;transform:translate(-50%,-50%);
  border:0;border-radius:50%;cursor:pointer;padding:0;
  background:radial-gradient(circle at 35% 30%,#fbe3e9 0%,var(--pink) 42%,var(--pink-rim) 100%);
  box-shadow:0 4px 0 #b97f90,0 6px 10px #0007,inset 0 -3px 5px #c98a9c66;
  -webkit-tap-highlight-color:transparent;transition:transform .07s, box-shadow .07s;
  display:grid;place-items:center;
  font:clamp(12px,3.4vw,16px)/1 var(--font-display);color:#b4587b;
}
.hw.down{transform:translate(-50%,calc(-50% + 3px));box-shadow:0 1px 0 #b97f90,0 2px 4px #0006,inset 0 2px 6px #b06d8288}
.hw:focus-visible{outline:3px solid #fff;outline-offset:3px}
#lips{position:absolute;left:49.6%;top:23.45%;width:15%;height:9%;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent}
#lips:focus-visible{outline:2px solid #fff;outline-offset:2px}
.kiss{position:absolute;pointer-events:none;font-size:clamp(16px,5vw,24px);color:#e8669a;transform:translate(-50%,-50%);animation:kissUp 1.1s ease-out forwards}
@keyframes kissUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.kiss{animation-duration:.01s}}
#bA{left:35.11%;top:85.62%} #bB{left:49.62%;top:88.5%} #bC{left:64.12%;top:85.51%}

.say{
  min-height:52px;box-sizing:border-box;display:flex;align-items:center;gap:10px;position:relative;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.45
}
.say::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.say b{font-family:var(--font-display);font-weight:400;color:var(--pink-deep);white-space:nowrap}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.m .sub{font-size:12px;color:var(--muted)}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-width:0;text-align:center}
.m small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.m div{font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{color:var(--pink-deep);font-size:12px!important;letter-spacing:0}
.hearts i{font-style:normal;color:#d9cfd3}
.keys{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin:0}
.keys kbd{font:12px var(--font-display);background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--ink)}
.kbonly{display:none}
@media (hover:hover) and (pointer:fine){ .kbonly{display:inline} }

details.settings{background:var(--card);border:1px solid var(--line);border-radius:16px}
details.settings summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center;min-height:24px}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:"＋";color:var(--muted)}
details.settings[open] summary::after{content:"－"}
details.settings summary:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px;border-radius:16px}
.rows{display:flex;flex-direction:column;gap:2px;padding:0 14px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-top:1px solid var(--line);font-size:15px}
.row input[type=text]{font:16px var(--font-body);border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;width:9em;max-width:55%;color:var(--ink)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink-deep)}
.row button{font:15px var(--font-body);color:#b2405f;background:none;border:0;padding:10px 0;cursor:pointer}
.row input:focus-visible,.row button:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}
.confirm{background:#fff4f7;border:1px solid var(--pink-rim);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:15px}
.confirm button{font:15px var(--font-body);border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.confirm .yes{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep)}
@media (prefers-reduced-motion:reduce){ .hw{transition:none} }
</style>

</head>

const KEY='onmagotchi.v1';
function fresh(){const now=Date.now();return{v:2,born:now,gt:0,last:now,stage:'egg',type:'A',hunger:3,happy:3,weight:5,poops:0,dirt:0,sick:false,sickT:0,
  lights:true,asleep:false,dead:false,mistakes:0,disc:25,points:0,inv:{cake:0,milk:0},own:{},eq:{},snacks:0,petCD:0,walkCD:0,
  nextPoop:60*MIN,nextDirt:3*HOUR,nextFake:15*MIN,fakeCall:0,hungerT:0,happyT:0,poopDirtyT:0,starveT:0,hungerZeroT:0,happyZeroT:0,missH:false,missJ:false,lightsOnSleepT:0,name:'온마'}}

try{const o=JSON.parse(localStorage.getItem(KEY)); if(o&&typeof o.gt==='number'){S=Object.assign(fresh(),o); S.v=2; if(!S.inv)S.inv={cake:0,milk:0}; if(S.stage==='adult'&&!S.type)S.type='A';}}catch(e){}
if(!S)S=fresh();

let speed=1, quiet=false;
const isNight=ts=>{const h=new Date(ts).getHours();return h>=22||h<8};
const FAT={baby:15,adult:35}, SICKW={baby:25,adult:55};
const isFat=()=>S.stage!=='egg'&&S.weight>=FAT[S.stage];
const awake=()=>S.stage!=='egg'&&!S.dead&&!S.asleep;
function needs(){return !S.dead&&S.stage!=='egg'&&(S.hunger===0||S.happy===0||S.poops>0||S.sick||(S.asleep&&S.lights)||S.fakeCall>0)}
function makeSick(why){ if(S.sick||S.dead)return; S.sick=true;S.sickT=0;S.mistakes++;event(why); }

function sim(dt){
  if(S.dead) return;
  S.gt+=dt;
  if(S.stage==='egg'){ if(S.gt>=45e3){S.stage='baby';S.nextFake=15*MIN;event('hatch')} return; }
  if(S.stage==='baby' && S.gt>=HOUR){ evolve(); }
  if(S.sick){S.sickT+=dt; if(S.sickT>12*HOUR){die();return}}
  if(S.asleep){
    if(S.lights){S.lightsOnSleepT+=dt; if(S.lightsOnSleepT>30*MIN){S.lightsOnSleepT=-1e15;S.mistakes++;}}
    return; // 자는 동안은 배고픔·기분이 줄지 않아요
  }
  S.hungerT+=dt; S.happyT+=dt;
  const happyStep=(S.dirt>=3?35:50)*MIN*(S.own.bear?1.3:1);
  while(S.hungerT>=60*MIN){S.hungerT-=60*MIN; if(S.hunger>0){S.hunger--; if(S.hunger===0)event('hungry')}}
  while(S.happyT>=happyStep){S.happyT-=happyStep; if(S.happy>0){S.happy--; if(S.happy===0)event('bored')}}
  S.nextPoop-=dt; if(S.nextPoop<=0){ if(S.poops<4)S.poops++; S.nextPoop=(90+Math.random()*60)*MIN; event('poop'); }
  S.nextDirt-=dt; if(S.nextDirt<=0){ if(S.dirt<3){S.dirt++; if(S.dirt===3)event('dirty')} S.nextDirt=3*HOUR; }
  if(S.poops>0){S.poopDirtyT+=dt; if(S.poops>=3 || S.poopDirtyT>3*HOUR) makeSick('sickPoop');} else S.poopDirtyT=0;
  if(S.hunger===0){S.hungerZeroT+=dt; if(S.hungerZeroT>15*MIN&&!S.missH){S.missH=true;S.mistakes++;} if(S.hungerZeroT>3*HOUR) makeSick('sickHunger'); if(S.hungerZeroT>12*HOUR){die();return}}
  else {S.hungerZeroT=0;S.missH=false;}
  if(S.happy===0){S.happyZeroT+=dt; if(S.happyZeroT>15*MIN&&!S.missJ){S.missJ=true;S.mistakes++;}} else {S.happyZeroT=0;S.missJ=false;}
  // 떼쓰기 호출
  if(S.fakeCall>0){S.fakeCall-=dt; if(S.fakeCall<=0){S.fakeCall=0;S.mistakes++;S.disc=Math.max(0,S.disc-10);}}
  else { S.nextFake-=dt; if(S.nextFake<=0){ S.nextFake=(S.stage==='baby'?(25+Math.random()*25):(60+Math.random()*60))*MIN;
      if(!S.sick&&S.hunger>0&&S.happy>0){S.fakeCall=15*MIN;event('fake')} } }
}
function evolve(){
  S.stage='adult'; S.weight+=10;
  S.type = S.mistakes>=3 ? 'R' : S.disc>=50 ? 'A' : 'I';
  event('grow');
}
function die(){S.dead=true;S.sick=false;event('dead')}
function updateSleep(ts){
  if(S.stage==='egg'||S.dead) return;
  const n=isNight(ts);
  if(n&&!S.asleep){S.asleep=true;S.lightsOnSleepT=0;S.fakeCall=0;event('sleep')}
  else if(!n&&S.asleep){S.asleep=false;S.lights=true;event('wake')}
}
// 자리를 비운 시간만큼 실제 시간 흐름을 따라잡기 (최대 7일)
function catchUp(){
  const now=Date.now(); let gap=Math.min(Math.max(0,now-S.last),7*24*HOUR); const gap0=gap; if(gap<2000){S.last=now;return null}
  const b={hunger:S.hunger,happy:S.happy,poops:S.poops,sick:S.sick,stage:S.stage,dead:S.dead,dirt:S.dirt,fake:S.fakeCall>0};
  let ts=now-gap; quiet=true;
  while(gap>0){const d=Math.min(gap,MIN); ts+=d; updateSleep(ts); sim(d); gap-=d; if(S.dead)break;}
  quiet=false; S.last=now; updateSleep(now);
  return {mins:Math.round(gap0/MIN),b};
}

function jo(n,a,b){const c=n.charCodeAt(n.length-1);return n+((c>=0xac00&&c<=0xd7a3&&(c-0xac00)%28)?a:b)}

let AC=null; const sndEl=document.getElementById('snd');
function beep(type){
  if(!sndEl.checked) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){return}
  const seq={tap:[[2400,.035]],ok:[[2000,.05],[2600,.07]],no:[[700,.12]],call:[[2600,.06],[0,.05],[2600,.06],[0,.05],[2600,.06]],
    win:[[1800,.06],[2200,.06],[2800,.12]],lose:[[900,.1],[600,.16]],hatch:[[1500,.08],[2000,.08],[2500,.08],[3000,.15]],coin:[[2600,.04],[3400,.08]]}[type]||[[2000,.05]];
  let t=AC.currentTime;
  for(const [f,d] of seq){ if(f){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.03;o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);} t+=d; }
}

/* ---------- weather (오늘 날씨는 날짜로 정해져요) ---------- */
function weather(ts=Date.now()){
  const d=new Date(ts); const key=d.getFullYear()*1000+d.getMonth()*40+d.getDate()+(d.getHours()<12?0:500);
  let h=key*2654435761%4294967296; h=(h^(h>>>13))>>>0; const r=(h%100)/100;
  const winter=[11,0,1].includes(d.getMonth());
  const w=r<.5?'sun':r<.75?'cloud':(winter?'snow':'rain');
  const hr=d.getHours(); const tod=hr>=6&&hr<17?'day':hr>=17&&hr<19?'dusk':'night';
  return {w,tod};
}

function openSub(title,items){ if(!items.length)return; mode='sub'; sub={title,items,i:0}; say(items[0].label); }

  if(S.stage==='egg'){ beep('tap'); say('아직 알이에요. 곧 깨어날 거예요!'); return; }
  if(mode==='game2'){ gameInput2(btn); return; }
  if(mode==='walk'){ return; }
  beep('tap');
  switch(mode){
    case 'main':
      if(btn==='A'){sel=(sel+1)%MENU.length; say(MENU_KO[MENU[sel]]);}
      else if(btn==='C'){ if(sel>=0) sel=-1; else mode='clock'; }
      else if(btn==='B'){ if(sel<0){mode='clock';return} run(MENU[sel]); }
      return;
    case 'clock': mode='main'; return;
    case 'sub':
      if(btn==='A'){sub.i=(sub.i+1)%sub.items.length; say(sub.items[sub.i].label);}
      else if(btn==='C'){mode='main';}
      else {const it=sub.items[sub.i]; mode='main'; it.act();}

function run(k){
  const n=nm();
  if(S.asleep && !['light','status'].includes(k)){ beep('no'); say(`쉿, ${n} 자고 있어요.`); return; }
  switch(k){
    case 'meal': {
      const items=[{icon:'meal',label:'밥 — 배고픔 +1, 몸무게 +1',act:()=>feed('meal')},{icon:'candy',label:'사탕 — 기분 +1, 몸무게 +2',act:()=>feed('candy')}];
      if(S.inv.cake) items.push({icon:'cake',label:`케이크 (${S.inv.cake}개) — 기분 +2, 배고픔 +1`,act:()=>feed('cake')});
      if(S.inv.milk) items.push({icon:'milk',label:`딸기우유 (${S.inv.milk}개) — 기분 +1, 배고픔 +1`,act:()=>feed('milk')});
      openSub('meal',items); break; }
    case 'play':
      if(S.sick){beep('no');say('아파서 놀 힘이 없대요. 약부터 주세요.');return}
      openSub('play',[{icon:'game1',label:'왼쪽? 오른쪽? — 5번 중 3번 맞히기',act:()=>refuseCheck()||startGame1()},
        {icon:'game2',label:'간식 받기 — 떨어지는 간식을 받아요',act:()=>refuseCheck()||startGame2()},
        {icon:'petting',label:'쓰다듬기',act:petIt}]); break;
    case 'clean':
      openSub('clean',[{icon:'poop',label:'응가 치우기',act:cleanPoop},{icon:'bath',label:'목욕시키기',act:bath}]); break;
    case 'med':
      if(!S.sick){beep('no');say('아프지 않아서 약은 싫대요.');return}
      play('med',1500,()=>{S.sick=false;S.sickT=0;beep('ok');say('약을 먹고 다 나았어요!');save()}); break;
    case 'scold': scold(); break;
    case 'light':
      S.lights=!S.lights; S.lightsOnSleepT=0; say(S.lights?'불을 켰어요.':'불을 껐어요. 잘 자.'); save(); break;
    case 'status': mode='status'; page=0; say('A나 B로 다음 쪽, C로 나가요. 나이·몸무게 → 배고픔 → 기분 → 훈육 → 포인트'); break;
    case 'shop': mode='shop'; shopI=0; shopSay(); break;
    case 'walk': startWalk(); break;
  }
}
function refuseCheck(){
  if(S.disc<50 && Math.random()<.2){play('refuse',1000,()=>{});beep('no');say(`${nm()} 놀기 싫다고 고집을 부려요. 훈육이 필요해요.`);return true}
  return false;
}
function feed(kind){
  const n=nm();
  if(kind==='meal'){
    if(S.hunger>=4){ play('refuse',1000,()=>{}); beep('no'); say('배불러서 더는 못 먹겠대요.'); return; }
    if(S.disc<50 && Math.random()<.3){ play('refuse',1000,()=>{}); beep('no'); say(`${n} 편식해요! 훈육을 하면 잘 먹게 돼요.`); return; }
  }
  if(kind!=='meal'){ if(kind==='cake'||kind==='milk'){ if(!S.inv[kind])return; S.inv[kind]--; } }
  play('eat_'+kind,1500,()=>{
    const fx={meal:[1,0,1],candy:[0,1,2],cake:[1,2,3],milk:[1,1,1]}[kind];
    S.hunger=Math.min(4,S.hunger+fx[0]); S.happy=Math.min(4,S.happy+fx[1]); S.weight+=fx[2];
    if(kind!=='meal')S.snacks++;
    beep('ok'); say({meal:`${n} 밥을 냠냠 먹었어요.`,candy:'달콤한 사탕! 기분이 좋아졌어요.',cake:'케이크를 먹고 신났어요!',milk:'딸기우유를 꿀꺽꿀꺽 마셨어요.'}[kind]);
    if(S.weight>=SICKW[S.stage]) makeSick('sickFat');
    save();
  });
}

function buy(){

    pdir=1; drawPet(now,'','c'); txt('?',8+(blink?0:1),24); txt('?',53-(blink?0:1),24);
    txt('A',3,40,C.pinkD); txt('C',58,40,C.pinkD); txt((game.round+1)+'/5',2,16);
  }else if(game.phase==='reveal'){
    pdir=game.dir; const hit=game.guess===game.dir; drawPet(now,hit?'happy':'sad','c');
    if(hit){ctx.strokeStyle=C.red;ctx.lineWidth=1;ctx.beginPath();ctx.arc(55.5,21.5,4.5,0,7);ctx.stroke()} else txt('X',54,19,'#4a6fd8');
    txt((game.round+1)+'/5',2,16);

    const win=game.wins>=3; pdir=1; drawPet(now,win?'happy':'','c'); txt(win?'WIN!':'LOSE',2,16,win?C.red:'#4a6fd8'); txt(game.wins+'P',2,23,C.pinkD);

const FALL=['candy','cake','milk'];
function drawGame2(now,dt){
  const g=game; g.t+=dt;
  const left=Math.max(0,20-(g.t/1000|0));
  if(!g.done){
    g.spawn-=dt; if(g.spawn<=0 && g.t<19000){g.spawn=850+Math.random()*350; g.items.push({x:6+Math.random()*48|0,y:15,k:FALL[Math.random()*3|0]}); g.total++;}
    g.items.forEach(it=>it.y+=dt*0.02);
  }
  pdir=1; const rows=SP[petKey('happy')]; const w=rows[0].length;
  const b=drawPet(now,'',Math.round(g.x-w/2));
  const catchL=b.x+3, catchR=b.x+w-3, catchY=b.y+4;
  g.items=g.items.filter(it=>{

    if(it.y>48) return false;
    const ic=ICONS[it.k]; ctx.save(); ctx.beginPath(); ctx.rect(0,15,64,34); ctx.clip(); spr(ctx,ic.r.slice(0,8).map(r=>r.slice(0,10)),Math.round(it.x),Math.round(it.y),ic.m); ctx.restore(); return true;
  });
  txt(String(left),2,16,C.muted); txt(g.caught+'',52,16,C.pinkD);
  if(!g.done && g.t>=20500){g.done=true;g.endT=g.t;const win=g.caught>=8;const pts=finishGame(Math.ceil(g.caught/2),win,'g2');
    say(win?`간식을 ${g.caught}개 받았어요! 이겼다! 기분 +1, ${pts}포인트 획득.`:`간식을 ${g.caught}개 받았어요. ${pts}포인트를 받았어요. 8개 이상이면 이겨요.`); save();}
  if(g.done){ panel(); drawPet(now,g.caught>=8?'happy':'','c'); txt(g.caught>=8?'WIN!':'END',2,16,g.caught>=8?C.red:'#4a6fd8'); txt(g.caught+'',2,23,C.pinkD);
    if(g.t>g.endT+2600){mode='main';game=null} }
}
function drawWalk(now,dt){
  const wk=walk; wk.t+=dt; const w=wk.w, [c1,c2]=skyColors(w.tod);
  let g=ctx.createLinearGradient(0,15,0,40); g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; ctx.fillRect(0,15,64,34);
  const off=wk.end?((wk.end/40)|0):((wk.t/40)|0);
  // hills & trees
  ctx.fillStyle=w.w==='snow'?'#eef3f7':'#a9d69c'; ctx.fillRect(0,38,64,11);
  for(let i=0;i<4;i++){const tx=((i*22-off)%88+88)%88-12; ctx.fillStyle='#8b6a4c';ctx.fillRect(tx+3,30,2,8);ctx.fillStyle=w.w==='snow'?'#dfe9ef':'#6fbf73';ctx.fillRect(tx,24,8,7);ctx.fillRect(tx+1,22,6,2)}
  for(let i=0;i<6;i++){const fx=((i*13-off*2)%78+78)%78-6; ctx.fillStyle=['#ff8fb3','#ffd34d','#fff'][i%3]; ctx.fillRect(fx,44+(i%2),1,1)}
  if(w.w==='cloud'||w.w==='rain'){ctx.fillStyle='#ffffffcc';ctx.fillRect(((40-off/3)%80+80)%80-10,18,9,3)}
  if(w.w==='rain'){ctx.fillStyle='#5f8fd8';for(let i=0;i<12;i++){ctx.fillRect((i*7+((now/40)|0))%64,15+(((now/30)|0)+i*5)%30,1,2)}}
  if(w.w==='snow'){ctx.fillStyle='#fff';for(let i=0;i<12;i++){ctx.fillRect((i*9+((now/120)|0))%64,15+(((now/90)|0)+i*5)%30,1,1)}}
  pdir=1; const b=drawPet(now,wk.end?'happy':'','c');
  if(w.w==='rain'&&S.own.umbrella){spr(ctx,ICONS.umbrella.r.slice(0,4),b.x+b.w-6,Math.max(15,b.y-4),ICONS.umbrella.m);}
  if(!wk.end && wk.t>=wk.dur) endWalk();
  if(wk.end){ const ic=ICONS[wk.find]; spr(ctx,ic.r,Math.min(b.x+b.w+1,53),36,ic.m); if(wk.t>wk.end+2500){mode='main';walk=null} }
}

function awaySummary(r){
  if(!r || r.mins<5) return null;
  const t=r.mins>=60?`${Math.floor(r.mins/60)}시간 ${r.mins%60}분`:`${r.mins}분`;
  if(S.dead) return `${t} 동안 자리를 비운 사이 ${nm()} 별나라로 떠났어요… B를 누르면 새 알을 받아요.`;
  const p=[];
  if(r.b.stage!==S.stage) p.push(S.stage==='adult'?`${TYPE_KO[S.type]} 어른으로 자랐어요`:'알에서 태어났어요');
  if(S.poops>r.b.poops) p.push(`응가 ${S.poops-r.b.poops}개`);
  if(S.sick&&!r.b.sick) p.push('병에 걸렸어요');
  if(S.hunger===0) p.push('배가 고파요'); else if(S.hunger<r.b.hunger) p.push(`배고픔 ${r.b.hunger}→${S.hunger}`);
  if(S.happy<r.b.happy) p.push(`기분 ${r.b.happy}→${S.happy}`);
  if(S.dirt>r.b.dirt) p.push('꼬질꼬질해졌어요');
  if(S.fakeCall>0) p.push('떼를 쓰고 있어요');
  if(S.asleep) p.push('지금은 자는 중');
  return `${t} 만이에요! ` + (p.length?p.join(' · '):'잘 지내고 있었어요.');
}
function greet(){
  const r=catchUp(); const a=awaySummary(r); if(a){say(a);return}
  if(S.dead) event('dead');
  else if(S.stage==='egg') say('알을 데우는 중이에요… 1분 안에 깨어나요.');
  else say(S.sick?`${nm()} 아파요! 약을 주세요.`:S.hunger===0?`${nm()} 배고파해요.`:S.poops?'응가가 있어요. 청소해 주세요.':S.asleep?`${nm()} 자고 있어요.`:`${nm()} 기다리고 있었어요! A를 눌러 메뉴를 골라 보세요.`);
}

let kissAudio=null;
$('lips').addEventListener('click',()=>{
  try{ if(!kissAudio) kissAudio=new Audio(KISS_SRC); kissAudio.currentTime=0; const p=kissAudio.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
  const h=document.createElement('span'); h.className='kiss'; h.textContent='♥'; h.style.left='49.6%'; h.style.top='20%';
  $('device').appendChild(h); setTimeout(()=>h.remove(),1200);
});

/* ---------- 디자인 미리보기용 ---------- */
window.onmaPreview=(canvas,o,t)=>{
  const keepCtx=ctx, keepS=JSON.stringify(S), pd=pdir; ctx=canvas.getContext('2d');
  Object.assign(S,{stage:o.stage,type:o.type||'A',weight:o.fat?60:5,dirt:o.dirt||0,eq:o.eq||{},own:o.own||{},fakeCall:0,dead:false}); pdir=1;
  room(t); if(o.mood==='dead'){drawDead(t)} else {const b=drawPet(t,o.mood,'c'); drawFx(b,o.mood,t);}
  ctx=keepCtx; S=JSON.parse(keepS); pdir=pd;
};
requestAnimationFrame(t=>{lastFrame=t;frame(t)});

})();
